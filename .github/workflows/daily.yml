name: 시세 갱신

on:
  schedule:
    # GitHub 예약 실행은 정각에 몰려 자주 밀리거나 빠집니다 (2026-09-21 16:00 KST 실행이 통째로 누락됨).
    # 그래서 정각을 피한 시각에 하루 네 번 걸어둡니다. 한두 번 빠져도 다음 실행이 채웁니다.
    - cron: "37 21 * * 1-5"   # 06:37 KST — 미국장 마감 후
    - cron: "43 23 * * 1-5"   # 08:43 KST — 위 실행이 빠졌을 때 대비
    - cron: "17 7 * * 1-5"    # 16:17 KST — 국내장 마감 후
    - cron: "23 10 * * 1-5"   # 19:23 KST — 위 실행이 빠졌을 때 대비
  workflow_dispatch:        # 버튼으로 직접 돌릴 때

permissions:
  contents: write           # data.js 를 커밋하려면 필요합니다

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install --upgrade -r requirements.txt

      - name: 시세 수집
        env:
          # fallback: GitHub·Hugging Face 소스로 못 채운 종목에만 야후 호출 (기본)
          # off: 야후를 전혀 부르지 않음 / on: 전 종목 야후 교차검증 (429 위험)
          USE_YAHOO: fallback
          # 실행마다 야후에 묻는 종목 수 (분배금 두 번째 소스용 순환 캐시). 0 이면 끔
          YAHOO_ROTATE: "15"
        run: python collect.py

      - name: 변경분 커밋
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data.js universe yahoo_cache.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "바뀐 내용이 없습니다."
          else
            git commit -m "시세 갱신 $(date -u +'%Y-%m-%d %H:%M UTC')"
            # 실행 중에 누가 main 에 올렸으면 그 위에 얹어서 올립니다
            git pull --rebase -X theirs origin main || git rebase --abort
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: jsDelivr 캐시 비우기
        if: steps.commit.outputs.changed == 'true'
        run: |
          # jsDelivr 는 브랜치 경로를 12시간 캐시합니다. 비워주지 않으면
          # 커밋해도 페이지는 반나절 동안 옛날 값을 봅니다.
          # 커밋 직후엔 jsDelivr 가 main 브랜치를 아직 옛 커밋으로 보고 있어서
          # 한 번만 비우면 옛 파일을 다시 캐시하는 경우가 있습니다 (실측). 간격을 두고 두 번 비웁니다.
          purge() {
            for f in data.js tax.js universe/*.js; do
              curl -sS -o /dev/null -w "%{http_code} $f\n" "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/$f" || true
              sleep 0.3
            done
          }
          sleep 45; purge
          sleep 60; purge
